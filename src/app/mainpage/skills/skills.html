<section id="skills" class="skills-section section-with-clouds">
  <div class="skills-shadow-layer" aria-hidden="true">
    <img src="img/skills/Green-shadow-2.svg" alt="" class="skills-green-shadow" />
  </div>
  <div class="section-container">
    <div class="skills-main-box">
      <div class="skills-left">
        <div class="skill-icon-box">
          <!-- Skill icons are decorative because the adjacent labels provide their accessible names. -->
          @for (skill of skills; track skill.labelKey) {
            <div class="skill-item">
              <img
                [src]="skill.icon"
                alt=""
                class="skill-icon"
                [class.skill-icon-accent]="skill.accent"
              />

              <p class="skill-label">
                {{ skill.labelKey | translate }}
              </p>
            </div>
          }
        </div>
      </div>

      <div class="skills-right">
        <div class="skill-text-box">
          <div class="skill-heading-line">
            <h2 class="skill-heading">
              {{ 'skills.title' | translate }}
            </h2>
            <img src="img/skills/line.svg" alt="" class="skill-line" aria-hidden="true" />
          </div>

          <div class="skill-content-box">
            <p>
              {{ 'skills.intro' | translate }}
            </p>
            <div class="skill-cta-box">
              <div class="skill-learning-copy">
                <p class="skill-subtitle">
                  {{ 'skills.questionStart' | translate }}
                  <span class="skill-subtitle-highlight">
                    {{ 'skills.questionHighlight' | translate }}
                  </span>
                </p>
                <p>
                  {{ 'skills.description' | translate }}
                </p>
              </div>
              <button type="button" class="get-button" (click)="scrollToContact()">
                {{ 'skills.cta' | translate }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
