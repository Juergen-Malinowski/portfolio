<section class="landing-section section-with-clouds">
  <div class="hero-wave-layer" aria-hidden="true">
    <picture>
      <source media="(min-width: 2000px)" srcset="img/landing/Hero-Wave-Widescreen.svg" />

      <source
        media="(min-width: 900px) and (max-width: 1279px)"
        srcset="img/landing/Hero-Wave-Intermediate.svg"
      />

      <source
        media="(min-width: 480px) and (max-width: 899px)"
        srcset="img/landing/Hero-Wave-Tablet.svg"
      />

      <source media="(max-width: 479px)" srcset="img/landing/Hero-Wave-Mobile.svg" />

      <img src="img/landing/Hero-Wave.svg" alt="" class="hero-wave" />
    </picture>
  </div>

  <div class="section-container landing-container">
    <div class="landing-hero">
      <div class="portrait-column">
        <picture>
          <source media="(max-width: 479px)" srcset="img/landing/Hero-Purple-Shadow-Mobile.svg" />

          <img
            src="img/landing/Hero-Purple-Shadow-Desktop.svg"
            alt=""
            class="cloud-img cloud-purple-desktop"
          />
        </picture>

        <picture>
          <source media="(max-width: 479px)" srcset="img/landing/Hero-Green-Shadow-Mobile.svg" />

          <img
            src="img/landing/Hero-Green-Shadow-Desktop.svg"
            alt=""
            class="cloud-img cloud-green-desktop"
          />
        </picture>

        <img
          src="img/landing/JM-5-500kB.webp"
          alt="Portrait of Jürgen Malinowski"
          class="landing-image"
        />
      </div>

      <div class="text-column">
        <div class="headline-box">
          <div class="left-box">
            <p class="vertical-text">{{ 'landingpage.intro' | translate }}</p>
          </div>

          <div class="right-box">
            <p class="landing-title">Jürgen Malinowski</p>
            <p class="landing-subtitle h2-purple">{{ 'landingpage.role' | translate }}</p>
          </div>
        </div>

        <button class="talk-button">{{ 'landingpage.cta' | translate }}</button>
      </div>
    </div>

    <div class="social-footer-box">
      <div class="footer-line"></div>
      <img src="img/landing/Github-Icon.svg" alt="GitHub" class="social-icon" />
      <img src="img/landing/Mail-Icon.svg" alt="Email" class="social-icon" />
      <img src="img/landing/Linkedin-Icon.svg" alt="LinkedIn" class="social-icon" />
      <span class="subtitle email-text">kontakt@juergen-malinowski.de</span>
    </div>
  </div>

  <div class="scroll-hint subtitle">← {{ 'landingpage.scroll' | translate }} →</div>
</section>
