<section id="about" class="about-section section-with-clouds">
  <!-- Decorative background layer -->
  <div class="cloud-layer" aria-hidden="true">
    <img src="img/about/Purple shadow 2.svg" alt="" class="cloud-img cloud-about-1" />
  </div>

  <div class="section-container">
    <div class="about-main-box">
      <div class="about-left">
        <h1>{{ 'about.title' | translate }}</h1>

        <p class="about-intro">
          {{ 'about.intro' | translate }}
        </p>

        <div class="about-content-wrapper">
          <div class="about-item">
            <img src="img/about/Capa.svg" class="about-icon icon-capa" alt="" />
            <p>{{ 'about.location' | translate }}</p>
          </div>

          <div class="about-item">
            <img src="img/about/Lamp.svg" class="about-icon icon-lamp" alt="" />
            <p>{{ 'about.learning' | translate }}</p>
          </div>

          <div class="about-item">
            <img src="img/about/Puzzle.svg" class="about-icon icon-puzzle" alt="" />
            <p>{{ 'about.problemSolving' | translate }}</p>
          </div>
        </div>
      </div>

      <div class="about-right">
        <img
          src="img/about/juergenAboutPortrait.jpg"
          [attr.alt]="'about.portraitAlt' | translate"
          class="about-picture"
        />

        <div class="circle-line"></div>
      </div>
    </div>
  </div>
</section>
