<section class="imprint-section">
  <div class="imprint-container section-container">
    <h1 class="imprint-title">
      {{ 'imprint.title' | translate }}
    </h1>

    <div class="imprint-content">
      <p class="imprint-legal-reference">
        {{ 'imprint.legalReference' | translate }}
      </p>

      <div class="imprint-block">
        <p>Jürgen Malinowski</p>
        <p>Grüner Jäger 1</p>
        <p>38159 Vechelde</p>
        <p>{{ 'imprint.country' | translate }}</p>
      </div>

      <div class="imprint-block">
        <h2>{{ 'imprint.contactTitle' | translate }}</h2>

        <p>
          {{ 'imprint.emailLabel' | translate }}
          <span class="imprint-email">kontakt@juergen-malinowski.de</span>
        </p>
      </div>
    </div>
  </div>
</section>
