<footer class="footer-section">
  <div class="footer-main-box">
    <button
      class="footer-logo-button"
      type="button"
      [attr.aria-label]="'footer.backToTop' | translate"
      (click)="scrollToTop()"
    >
      <img src="img/header/Juergen-Logo.svg" alt="Jürgen Malinowski" class="footer-logo" />
    </button>

    <p class="footer-copyright">© Jürgen Malinowski {{ currentYear }}</p>

    <div class="footer-social-links">
      <a
        class="footer-social-link"
        href="https://github.com/Juergen-Malinowski"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="'footer.github' | translate"
      >
        <img src="img/landing/Github-Icon.svg" alt="" aria-hidden="true" class="footer-icon" />
      </a>

      <button
        class="footer-social-link"
        type="button"
        [attr.aria-label]="'footer.email' | translate"
        (click)="scrollToContact()"
      >
        <img src="img/landing/Mail-Icon.svg" alt="" aria-hidden="true" class="footer-icon" />
      </button>

      <a
        class="footer-social-link"
        href="https://www.linkedin.com/in/j%C3%BCrgen-malinowski-289253425/"
        target="_blank"
        rel="noopener noreferrer"
        [attr.aria-label]="'footer.linkedin' | translate"
      >
        <img src="img/landing/Linkedin-Icon.svg" alt="" aria-hidden="true" class="footer-icon" />
      </a>
    </div>
    <div class="footer-legal-links">
      <a class="footer-legal-link" routerLink="/imprint">
        {{ 'footer.imprint' | translate }}
      </a>

      <a class="footer-legal-link" routerLink="/privacy">
        {{ 'footer.privacy' | translate }}
      </a>
    </div>
  </div>
</footer>
