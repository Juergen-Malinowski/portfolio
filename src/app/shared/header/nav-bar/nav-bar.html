<nav class="nav-container">
  <button
    class="burger-button"
    (click)="toggleMenu()"
    aria-label="Open navigation menu"
    [attr.aria-expanded]="menuOpen"
    aria-controls="main-navigation"
  >
    <span class="burger-line"></span>
    <span class="burger-line"></span>
    <span class="burger-line"></span>
  </button>

  <div id="main-navigation" class="nav-content" [ngClass]="{ open: menuOpen }">
    <div class="nav-links">
      <button class="nav-item subtitle" (click)="scrollToAbout()">
        {{ 'header.about_me' | translate }}
      </button>

      <button class="nav-item subtitle" (click)="scrollToSkills()">
        {{ 'header.skills' | translate }}
      </button>

      <button class="nav-item subtitle" (click)="scrollToProjects()">
        {{ 'header.portfolio' | translate }}
      </button>
    </div>

    <app-language-bar (languageChanged)="closeMenu()"></app-language-bar>
  </div>
</nav>
